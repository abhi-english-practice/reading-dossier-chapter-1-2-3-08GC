:root {
  --paper: #fcf8ef;
  --bg: #f4ecdf;
  --line: #ebd9bf;
  --teal: #009b8f;
}
.shell {
  grid-template-columns: clamp(192px, 12.5vw, 250px) minmax(0, 1fr);
  gap: clamp(14px, 1vw, 22px);
  max-width: 2080px;
  padding: clamp(12px, 1.1vw, 22px);
}
.sidebar {gap: 8px}
.ch {padding: 8px; border-radius: 13px}
.chhead {margin: 2px 3px 7px; gap: 8px}
.chhead img {width: 38px; height: 34px; flex: none}
.chhead b {font-size: 14px}
.chhead small {font-size: 10px; margin-top: 2px}
.lesson {margin: 0; gap: 7px; min-height: 36px; padding: 5px 6px; font-size: clamp(12px, .68vw, 14px); line-height: 1.25}
.lesson + .lesson {margin-top: 4px}
.lesson > span:nth-child(2) {min-width: 0; overflow-wrap: anywhere}
.lesson .num {width: 23px; height: 23px; font-size: 11px}
.lesson.active {background: #e2ffa9; border-color: #d6ec9a}
.lesson.active .num {background: #b1e16b}
.home-paper {padding: clamp(16px, 1.25vw, 26px); min-height: 0; border-radius: 16px}
.home-paper h1 {font-size: clamp(28px, 2.45vw, 48px); margin: 8px 0 0}
.home-paper .audioBar {
  display: grid;
  grid-template-columns: auto auto minmax(0, 1fr) auto auto auto;
  gap: 10px;
  background: #f5ead7;
  padding: 12px 15px;
  margin-top: 18px;
}
.home-paper .audioBar audio {display: none}
.audioBar .play {min-width: 100px; padding: 10px 15px; min-height: 40px}
.audioBar .stop {width: 38px; height: 38px; border-radius: 50%; background: #fffaf3}
.audioBar .seek {width: 100%; min-width: 0; accent-color: var(--teal); margin: 0; cursor: pointer}
.audioBar .time {font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap}
.audioBar .speed {padding: 6px; border: 0; background: transparent}
.audioBar .audioNote {grid-column: 1 / -1; min-width: 0; font-size: 12px}
.home-paper .toolbar {gap: 8px; margin: 19px 0 15px}
.home-paper .tiny {font-size: 12px; border-color: #dcd2c4; white-space: nowrap}
.home-paper .toolbar button[aria-pressed=true] {background: #e9f1dd; border-color: #c8d8b6}
.home-paper .toolbar button[data-toggle=high][aria-pressed=true] {background: transparent; border-color: #dcd2c4}
.home-paper .readinggrid {
  display: grid;
  align-items: start;
}
.home-paper .readingtext .following {background: #e8f2dc; border-radius: 4px; box-shadow: -5px 0 #e8f2dc, 5px 0 #e8f2dc}
.home-paper .imagecol {order: 0; margin: 0; width: 100%}
.home-paper .photo {aspect-ratio: 1.3; max-height: none; border: 1px solid var(--line); border-radius: 15px}
.home-collocations {margin-top: clamp(16px, 1.4vw, 26px); padding: 15px 18px; border-radius: 14px; background: #ffdcd6}
.home-collocations h2 {color: #aa2918; font-size: clamp(18px, 1.28vw, 24px); margin-bottom: 10px}
.home-chips {display: flex; flex-wrap: wrap; gap: 7px}
.home-chip {
  padding: 6px 12px;
  border: 0;
  border-radius: 20px;
  background: #fff9f5;
  font-size: clamp(12px, .83vw, 16px);
  text-align: left;
}
.home-chip:hover {background: #fff}
.home-pagination {display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; margin: 17px 4px 0}
.home-pagination .btn {justify-self: start; color: #62594f}
.home-pagination .btn:last-child {justify-self: end}
.home-pagination .note {font-size: 12px}
@media (max-width: 1050px) {
  .shell {grid-template-columns: 185px minmax(0, 1fr)}
}
@media (max-width: 850px) {
  .home-paper .readinggrid {gap: 14px}
  .home-paper .imagecol {order: -1}
  .home-paper .photo {aspect-ratio: 16/9; max-height: 370px}
  .home-paper .toolbar {margin-top: 14px}
}
@media (max-width: 620px) {
  .home-paper .audioBar {grid-template-columns: auto auto minmax(0,1fr) auto; gap: 8px; padding: 9px}
  .audioBar .play {min-width: 76px}
  .audioBar .seek {grid-column: 1 / 4; grid-row: 2}
  .audioBar .time {grid-row: 2; grid-column: 4; justify-self: end}
  .audioBar .speed {grid-column: 3; justify-self: end}
  .audioBar .audio-load {grid-column: 4}
  .home-pagination .btn {font-size: 12px; padding-inline: 8px}
}

/* Compact Home typography and a shared row for the passage and illustration. */
.home-paper .readinggrid {
  grid-template-columns: minmax(0, 1.16fr) minmax(0, 1fr);
  gap: clamp(16px, 1.4vw, 28px);
}
.home-paper .readingtext {
  font-size: clamp(16px, 1rem + .34vw, 22px);
  line-height: 1.56;
  text-align: start;
}
.home-paper .readingtext p {margin: 0 0 .62em}
.home-paper .readingtext > :last-child {margin-bottom: 0}
@media (min-width: 851px) {
  .home-paper .readinggrid:not(.with-translation) .imagecol {
    position: relative;
    align-self: stretch;
    min-height: clamp(210px, 17vw, 340px);
    container-type: inline-size;
  }
  .home-paper .readinggrid:not(.with-translation) .photo {
    position: absolute;
    inset: 0;
    height: 100%;
    max-height: 95cqw;
    aspect-ratio: auto;
  }
}
@media (max-width: 850px) {
  .home-paper .readinggrid {grid-template-columns: minmax(0, 1fr); gap: 14px}
  .home-paper .readingtext {font-size: 17px; line-height: 1.55}
}
#quiz-colloc .question {margin-bottom: 3px}
#quiz-colloc .colloc-hint {margin: 0 0 9px; color: #784635; font-size: 14px; line-height: 1.5}
.pen-tools {display: flex; align-items: center; gap: 6px; margin-left: auto; flex-wrap: wrap}
.home-paper .pen-tools [data-pen] {display: inline-flex; align-items: center; gap: 5px; min-height: 32px}
.pen-swatch {width: 11px; height: 11px; border-radius: 3px; border: 1px solid #0002}
.pen-swatch.yellow, .manual-highlight.yellow {background: #ffe374}
.pen-swatch.pink, .manual-highlight.pink {background: #ffaed0}
.manual-highlight {color: inherit; border-radius: 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone}
@media (max-width: 620px) {.pen-tools {margin-left: 0}}

n chair stands beside the window in my grandmother's living room. Next to it is a basket containing colourful balls of **wool**, several pairs of **knitting needles** and a collection of handwritten **patterns**. A small reading lamp provides light on dark winter afternoons.", "vi": "Một chiếc ghế gỗ đặt cạnh cửa sổ phòng khách của bà tôi. Bên cạnh là giỏ đựng những cuộn len nhiều màu, vài đôi kim đan và các mẫu đan viết tay. Chiếc đèn đọc sách nhỏ chiếu sáng vào những chiều mùa đông tối trời."}, {"en": "Grandma is particularly **fond of knitting**. Her needles move almost without sound as she turns ordinary wool into soft scarves, warm jumpers and brightly coloured hats. Some of her patterns are older than I am.", "vi": "Bà đặc biệt thích đan len. Kim đan chuyển động gần như không phát ra tiếng khi bà biến len thành khăn mềm, áo ấm và mũ rực rỡ. Một số mẫu đan còn lâu đời hơn cả tôi."}, {"en": "Whenever she asks whether I fancy learning something new, I usually agree. Making a neat **stitch**, however, requires more skill than it seems. I often **drop stitches**, but Grandma never minds showing me where I went wrong.", "vi": "Mỗi khi bà hỏi tôi có muốn học điều mới không, tôi thường đồng ý. Tuy nhiên, đan một mũi gọn gàng cần nhiều kỹ năng hơn tưởng tượng. Tôi hay làm tuột mũi đan, nhưng bà không ngại chỉ ra chỗ tôi làm sai."}, {"en": "“You just need to be **careful and patient**,” she says. There is something almost **magical** about watching a piece of clothing take shape. Even when the rest of the house is noisy, her little knitting corner remains wonderfully peaceful.", "vi": "“Cháu chỉ cần cẩn thận và kiên nhẫn,” bà nói. Nhìn một món đồ dần thành hình có điều gì đó gần như kỳ diệu. Ngay cả khi những nơi khác trong nhà ồn ào, góc đan len của bà vẫn rất yên bình."}], "v": [{"en": "wool", "vi": "len", "kind": "vocab", "context": "A wooden chair stands beside the window in my grandmother's living room. Next to it is a basket containing colourful balls of wool, several pairs of knitting needles and a collection of handwritten patterns. A small reading lamp provides light on dark winter afternoons.", "contextvi": "Một chiếc ghế gỗ đặt cạnh cửa sổ phòng khách của bà tôi. Bên cạnh là giỏ đựng những cuộn len nhiều màu, vài đôi kim đan và các mẫu đan viết tay. Chiếc đèn đọc sách nhỏ chiếu sáng vào những chiều mùa đông tối trời.", "example": "This jumper is made of soft wool from a local farm.", "examplevi": "Chiếc áo len này được làm từ len mềm của một trang trại địa phương."}, {"en": "knitting needles", "vi": "kim đan", "kind": "vocab", "context": "A wooden chair stands beside the window in my grandmother's living room. Next to it is a basket containing colourful balls of wool, several pairs of knitting needles and a collection of handwritten patterns. A small reading lamp provides light on dark winter afternoons.", "contextvi": "Một chiếc ghế gỗ đặt cạnh cửa sổ phòng khách của bà tôi. Bên cạnh là giỏ đựng những cuộn len nhiều màu, vài đôi kim đan và các mẫu đan viết tay. Chiếc đèn đọc sách nhỏ chiếu sáng vào những chiều mùa đông tối trời.", "example": "I found a pair of knitting needles in the bottom drawer.", "examplevi": "Tôi tìm thấy một đôi kim đan trong ngăn kéo dưới cùng."}, {"en": "patterns", "vi": "mẫu đan", "kind": "vocab", "context": "A wooden chair stands beside the window in my grandmother's living room. Next to it is a basket containing colourful balls of wool, several pairs of knitting needles and a collection of handwritten patterns. A small reading lamp provides light on dark winter afternoons.", "contextvi": "Một chiếc ghế gỗ đặt cạnh cửa sổ phòng khách của bà tôi. Bên cạnh là giỏ đựng những cuộn len nhiều màu, vài đôi kim đan và các mẫu đan viết tay. Chiếc đèn đọc sách nhỏ chiếu sáng vào những chiều mùa đông tối trời.", "example": "The shop sells simple patterns for beginners.", "examplevi": "Cửa hàng bán các mẫu đan đơn giản cho người mới."}, {"en": "fond of knitting", "vi": "yêu thích đan len", "kind": "colloc", "context": "Grandma is particularly fond of knitting. Her needles move almost without sound as she turns ordinary wool into soft scarves, warm jumpers and brightly coloured hats. Some of her patterns are older than I am.", "contextvi": "Bà đặc biệt thích đan len. Kim đan chuyển động gần như không phát ra tiếng khi bà biến len thành khăn mềm, áo ấm và mũ rực rỡ. Một số mẫu đan còn lâu đời hơn cả tôi.", "example": "My neighbour is fond of knitting hats for her grandchildren.", "examplevi": "Hàng xóm tôi thích đan mũ cho các cháu."}, {"en": "stitch", "vi": "mũi đan", "kind": "vocab", "context": "Whenever she asks whether I fancy learning something new, I usually agree. Making a neat stitch, however, requires more skill than it seems. I often drop stitches, but Grandma never minds showing me where I went wrong.", "contextvi": "Mỗi khi bà hỏi tôi có muốn học điều mới không, tôi thường đồng ý. Tuy nhiên, đan một mũi gọn gàng cần nhiều kỹ năng hơn tưởng tượng. Tôi hay làm tuột mũi đan, nhưng bà không ngại chỉ ra chỗ tôi làm sai.", "example": "One loose stitch can spoil the shape of a scarf.", "examplevi": "Một mũi đan lỏng có thể làm hỏng dáng chiếc khăn."}, {"en": "drop stitches", "vi": "làm tuột mũi đan", "kind": "colloc", "context": "Whenever she asks whether I fancy learning something new, I usually agree. Making a neat stitch, however, requires more skill than it seems. I often drop stitches, but Grandma never minds showing me where I went wrong.", "contextvi": "Mỗi khi bà hỏi tôi có muốn học điều mới không, tôi thường đồng ý. Tuy nhiên, đan một mũi gọn gàng cần nhiều kỹ năng hơn tưởng tượng. Tôi hay làm tuột mũi đan, nhưng bà không ngại chỉ ra chỗ tôi làm sai.", "example": "If you rush, you may drop stitches without noticing.", "examplevi": "Nếu vội vàng, bạn có thể làm tuột mũi đan mà không nhận ra."}, {"en": "careful and patient", "vi": "cẩn thận và kiên nhẫn", "kind": "colloc", "context": "“You just need to be careful and patient,” she says. There is something almost magical about watching a piece of clothing take shape. Even when the rest of the house is noisy, her little knitting corner remains wonderfully peaceful.", "contextvi": "“Cháu chỉ cần cẩn thận và kiên nhẫn,” bà nói. Nhìn một món đồ dần thành hình có điều gì đó gần như kỳ diệu. Ngay cả khi những nơi khác trong nhà ồn ào, góc đan len của bà vẫn rất yên bình.", "example": "You need to be careful and patient when repairing a watch.", "examplevi": "Bạn cần cẩn thận và kiên nhẫn khi sửa đồng hồ."}, {"en": "magical", "vi": "kỳ diệu", "kind": "vocab", "context": "“You just need to be careful and patient,” she says. There is something almost magical about watching a piece of clothing take shape. Even when the rest of the house is noisy, her little knitting corner remains wonderfully peaceful.", "contextvi": "“Cháu chỉ cần cẩn thận và kiên nhẫn,” bà nói. Nhìn một món đồ dần thành hình có điều gì đó gần như kỳ diệu. Ngay cả khi những nơi khác trong nhà ồn ào, góc đan len của bà vẫn rất yên bình.", "example": "The garden looked magical under the first snow of winter.", "examplevi": "Khu vườn trông thật kỳ diệu dưới lớp tuyết đầu mùa."}], "mc": [["What is beside the chair?", "A basket of knitting materials", "A computer", "A television"], ["What happens when the narrator knits too quickly?", "Some stitches are dropped", "The wool changes colour", "Grandma stops knitting"], ["How is the corner described?", "Peaceful", "Crowded", "Dark all day"]], "gr": [["Grandma is fond of ___ .", "knitting", "knit", "to knitting"], ["I fancy ___ something new.", "learning", "learn", "to learning"], ["She never minds ___ me.", "helping", "help", "to help"], ["I enjoy ___ with Grandma.", "knitting", "knit", "knits"], ["I am interested ___ learning new patterns.", "in", "on", "at"]], "wf": [["MAGIC", "magical", "The finished scarf looks almost ___ ."], ["CARE", "careful", "You need to be ___ with the needles."], ["PATIENT", "patience", "Knitting requires ___ ."], ["COLOUR", "colourful", "T  [{"en": "Staying healthy does not have to involve expensive equipment or a strict exercise programme. In fact, many ordinary leisure activities can help people **keep fit** without making exercise feel like hard work.", "vi": "Giữ gìn sức khỏe không nhất thiết cần thiết bị đắt tiền hay chương trình tập luyện nghiêm ngặt. Nhiều hoạt động giải trí thông thường giúp chúng ta giữ dáng mà không cảm thấy tập luyện là việc nặng nhọc."}, {"en": "Teenagers who enjoy team activities might choose to **play basketball** or **play football**, while others prefer to **play table tennis** with a friend. Those who dislike competitive sports could **do yoga** or **cycle** around a local park.", "vi": "Thanh thiếu niên thích hoạt động nhóm có thể chọn chơi bóng rổ hoặc bóng đá, trong khi những bạn khác thích chơi bóng bàn cùng bạn. Những người không thích thể thao cạnh tranh có thể tập yoga hoặc đạp xe quanh công viên."}, {"en": "Young people who are **crazy about outdoor activities** may also enjoy **mountain climbing**. Beginners can practise on an indoor **climbing wall**, where trained instructors teach them how to use **climbing equipment** safely. Such activities help **increase muscle strength** and improve balance. Long periods of inactivity, by contrast, may lead to a **decrease in muscle strength**.", "vi": "Người trẻ say mê hoạt động ngoài trời có thể thích leo núi. Người mới bắt đầu có thể tập trên tường leo núi trong nhà, nơi huấn luyện viên hướng dẫn sử dụng thiết bị an toàn. Các hoạt động này giúp tăng sức mạnh cơ bắp và cải thiện thăng bằng. Ngược lại, ít vận động trong thời gian dài có thể làm giảm sức mạnh cơ bắp."}, {"en": "The secret is to choose something enjoyable. You do not need to **play sport** every day or compete against other people to **stay fit**. A hobby that gets you moving regularly is a good place to start.", "vi": "Bí quyết là chọn điều thú vị. Bạn không cần chơi thể thao mỗi ngày hay thi đấu với người khác để duy trì sức khỏe. Một sở thích giúp bạn vận động thường xuyên là điểm khởi đầu tốt."}], "v": [{"en": "keep fit", "vi": "giữ gìn sức khỏe", "kind": "colloc", "context": "Staying healthy does not have to involve expensive equipment or a strict exercise programme. In fact, many ordinary leisure activities can help people keep fit without making exercise feel like hard work.", "contextvi": "Giữ gìn sức khỏe không nhất thiết cần thiết bị đắt tiền hay chương trình tập luyện nghiêm ngặt. Nhiều hoạt động giải trí thông thường giúp chúng ta giữ dáng mà không cảm thấy tập luyện là việc nặng nhọc.", "example": "Walking to school helps me keep fit without spending any money.", "examplevi": "Đi bộ đến trường giúp tôi giữ dáng mà không tốn tiền."}, {"en": "play basketball", "vi": "chơi bóng rổ", "kind": "colloc", "context": "Teenagers who enjoy team activities might choose to play basketball or play football, while others prefer to play table tennis with a friend. Those who dislike competitive sports could do yoga or cycle around a local park.", "contextvi": "Thanh thiếu niên thích hoạt động nhóm có thể chọn chơi bóng rổ hoặc bóng đá, trong khi những bạn khác thích chơi bóng bàn cùng bạn. Những người không thích thể thao cạnh tranh có thể tập yoga hoặc đạp xe quanh công viên.", "example": "Shall we play basketball after the rain stops?", "examplevi": "Chúng ta chơi bóng rổ sau khi mưa tạnh nhé?"}, {"en": "play football", "vi": "chơi bóng đá", "kind": "colloc", "context": "Teenagers who enjoy team activities might choose to play basketball or play football, while others prefer to play table tennis with a friend. Those who dislike competitive sports could do yoga or cycle around a local park.", "contextvi": "Thanh thiếu niên thích hoạt động nhóm có thể chọn chơi bóng rổ hoặc bóng đá, trong khi những bạn khác thích chơi bóng bàn cùng bạn. Những người không thích thể thao cạnh tranh có thể tập yoga hoặc đạp xe quanh công viên.", "example": "The children play football on a field behind the library.", "examplevi": "Bọn trẻ chơi bóng đá trên sân phía sau thư viện."}, {"en": "play table tennis", "vi": "chơi bóng bàn", "kind": "colloc", "context": "Teenagers who enjoy team activities might choose to play basketball or play football, while others prefer to play table tennis with a friend. Those who dislike competitive sports could do yoga or cycle around a local park.", "contextvi": "Thanh thiếu niên thích hoạt động nhóm có thể chọn chơi bóng rổ hoặc bóng đá, trong khi những bạn khác thích chơi bóng bàn cùng bạn. Những người không thích thể thao cạnh tranh có thể tập yoga hoặc đạp xe quanh công viên.", "example": "We usually play table tennis during our lunch break.", "examplevi": "Chúng tôi thường chơi bóng bàn vào giờ nghỉ trưa."}, {"en": "do yoga", "vi": "tập yoga", "kind": "colloc", "context": "Teenagers who enjoy team activities might choose to play basketball or play football, while others prefer to play table tennis with a friend. Those who dislike competitive sports could do yoga or cycle around a local park.", "contextvi": "Thanh thiếu niên thích hoạt động nhóm có thể chọn chơi bóng rổ hoặc bóng đá, trong khi những bạn khác thích chơi bóng bàn cùng bạn. Những người không thích thể thao cạnh tranh có thể tập yoga hoặc đạp xe quanh công viên.", "example": "My dad likes to do yoga before the rest of us wake up.", "examplevi": "Bố tôi thích tập yoga trước khi cả nhà thức dậy."}, {"en": "cycle", "vi": "đạp xe", "kind": "vocab", "context": "Teenagers who enjoy team activities might choose to play basketball or play football, while others prefer to play table tennis with a friend. Those who dislike competitive sports could do yoga or cycle around a local park.", "contextvi": "Thanh thiếu niên thích hoạt động nhóm có thể chọn chơi bóng rổ hoặc bóng đá, trong khi những bạn khác thích chơi bóng bàn cùng bạn. Những người không thích thể thao cạnh tranh có thể tập yoga hoặc đạp xe quanh công viên.", "example": "You can cycle along the river without crossing any busy roads.", "examplevi": "  lunch break.", "play table tennis"], ["My dad likes to ________ before the rest of us wake up.", "do yoga"], ["My cousins are ________, even in winter.", "crazy about outdoor activities"], ["Carrying light weights regularly can ________.", "increase muscle strength"], ["After weeks in bed, he noticed a ________.", "decrease in muscle strength"], ["I didn't use to ________, but now I swim twice a week.", "play sport"], ["They take the stairs rather than the lift to ________.", "stay fit"]]}, {"title": "Three People, Three Hobbies", "genre": "Interview / Dialogue", "p": [{"en": "The school magazine asked Lucas, Emma and Mia to describe their favourite ways of spending an afternoon.", "vi": "Tạp chí trường hỏi Lucas, Emma và Mia về cách họ thích dành một buổi chiều."}, {"en": "Reporter: Lucas, what's the oldest thing in your collection?\nLucas: A coin from the early twentieth century. I'm really **into collecting stamps and coins**. My grandfather introduced me to the hobby.", "vi": "Phóng viên: Lucas, món đồ cổ nhất trong bộ sưu tập của bạn là gì?\nLucas: Một đồng xu từ đầu thế kỷ XX. Tôi rất mê sưu tầm tem và tiền xu. Ông đã giới thiệu sở thích này cho tôi."}, {"en": "Reporter: Would you rather stay indoors or go outside?\nLucas: It depends on the weather. I like cycling, but on rainy days I prefer to stay at home.", "vi": "Phóng viên: Bạn thích ở trong nhà hay ra ngoài?\nLucas: Tùy thời tiết. Tôi thích đạp xe nhưng ngày mưa tôi thích ở nhà hơn."}, {"en": "Reporter: Emma, what about you?\nEmma: I'm **interested in music**. I love to **play the piano**, especially when nobody is listening!", "vi": "Phóng viên: Còn Emma thì sao?\nEmma: Tôi thích âm nhạc. Tôi rất thích chơi piano, nhất là khi không ai nghe!"}, {"en": "Reporter: Anything you hate doing?\nEmma: I **dislike cooking**, and I detest waiting in queues when I **go shopping**. I'd much rather spend the afternoon in a music shop.", "vi": "Phóng viên: Có việc gì bạn ghét làm không?\nEmma: Tôi không thích nấu ăn và ghét xếp hàng khi đi mua sắm. Tôi thích dành buổi chiều ở cửa hàng nhạc cụ hơn."}, {"en": "Reporter: Mia, do you agree?\nMia: Not at all! I love **cooking**, particularly **baking cakes**. I don't even mind washing the dishes.", "vi": "Phóng viên: Mia, bạn đồng ý không?\nMia: Hoàn toàn không! Tôi thích nấu ăn, nhất là làm bánh. Tôi thậm chí không ngại rửa bát."}, {"en": "Reporter: Perhaps Emma could provide the music while you prepare something delicious.", "vi": "Phóng viên: Có lẽ Emma có thể chơi nhạc trong khi bạn chuẩn bị món ngon."}], "v": [{"en": "into collecting stamps and coins", "vi": "mê sưu tầm tem và tiền xu", "kind": "colloc", "context": "Reporter: Lucas, what's the oldest thing in your collection?\nLucas: A coin from the early twentieth century. I'm really into collecting stamps and coins. My grandfather introduced me to the hobby.", "contextvi": "Phóng viên: Lucas, món đồ cổ nhất trong bộ sưu tập của bạn là gì?\nLucas: Một đồng xu từ đầu thế kỷ XX. Tôi rất mê sưu tầm tem và tiền xu. Ông đã giới thiệu sở thích này cho tôi.", "example": "Oliver is into collecting stamps and coins from countries he has visited.", "examplevi": "Oliver mê sưu tầm tem và tiền xu từ những nước cậu từng đến."}, {"en": "interested in music", "vi": "hứng thú với âm nhạc", "kind": "colloc", "context": "Reporter: Emma, what about you?\nEmma: I'm interested in music. I love to play the piano, especially when nobody is listening!", "contextvi": "Phóng viên: Còn Emma thì sao?\nEmma: Tôi thích âm nhạc. Tôi rất thích chơi piano, nhất là khi không ai nghe!", "example": "If you're interested in music, there's a free concert in the park.", "examplevi": "Nếu bạn hứng thú với âm nhạc, có một buổi hòa nhạc miễn phí trong công viên."}, {"en": "play the piano", "vi": "chơi đàn piano", "kind": "colloc", "context": "Reporter: Emma, what about you?\nEmma: I'm interested in music. I love to play the piano, especially when nobody is listening!", "contextvi": "Phóng viên: Còn Emma thì sao?\nEmma: Tôi thích âm nhạc. Tôi rất thích chơi piano, nhất là khi không ai nghe!", "example": "My cousin learnt to play the piano by practising a little every day.", "examplevi": "Em họ tôi học chơi piano bằng cách luyện tập một chút mỗi ngày."}, {"en": "dislike cooking", "vi": "không thích nấu ăn", "kind": "colloc", "context": "Reporter: Anything you hate doing?\nEmma: I dislike cooking, and I detest waiting in queues when I go shopping. I'd much rather spend the afternoon in a music shop.", "contextvi": "Phóng viên: Có việc gì bạn ghét làm không?\nEmma: Tôi không thích nấu ăn và ghét xếp hàng khi đi mua sắm. Tôi thích dành buổi chiều ở cửa hàng nhạc cụ hơn.", "example": "I dislike cooking when the kitchen is crowded.", "examplevi": "Tôi không thích nấu ăn khi bếp đông người."}, {"en": "go shopping", "vi": "đi mua sắm", "kind": "colloc", "context": "Reporter: Anything you hate doing?\nEmma: I dislike cooking, and I detest waiting in queues when I go shopping. I'd much rather spend the afternoon in a music shop.", "contextvi": "Phóng viên: Có việc gì bạn ghét làm không?\nEmma: Tôi không thích nấu ăn và ghét xếp hàng khi đi mua sắm. Tôi thích dành buổi chiều ở cửa hàng nhạc cụ hơn.", "example": "Let's go shopping before the shops close.", "examplevi": "Hãy đi mua sắm trước khi cửa hàng đóng cửa."}, {"en": "cooking", "vi": "nấu ăn", "kind": "vocab", "context": "Reporter: Mia, do you agree?\nMia: Not at all! I love cooking, particularly baking cakes. I don't even mind washing the dishes.", "contextvi": "Phóng viên: Mia, bạn đồng ý không?\nMia: Hoàn toàn không! Tôi thích nấu ăn, nhất là làm bánh. Tôi thậm chí không ngại rửa bát.", "example": "Cooking for six people takes longer than I expected.", "examplevi": "Nấu ăn cho sáu người mất nhiều thời gian hơn tôi tưởng."}, {"en": "baking cakes", "vi": "làm bánh", "kind": "colloc", "context": "Reporter: Mia, do you agree?\nMia: Not at all! I love cooking, particularly baking cakes. I don't even mind washing the dishes.", "contextvi": "Phóng viên: Mia, bạn đồng ý không?\nMia: Hoàn toàn không! Tôi thích nấu ăn, nhất là làm bánh. Tôi thậm chí không ngại rửa bát.", "example": "Baking cakes is messy, but the results are usually worth it.", "examplevi": "Làm bánh khá bừa bộn, nhưng kết quả thường xứng đáng công sức."}], "mc": [["Who introduced Lucas to collecting?", "His grandfather", "His teacher", "His sister"], ["What does Emma enjoy?", "Playing the piano", "Cooking", "Waiting in queues"], ["What does Mia not mind doing?", "Washing the dishes", "Collecting coins", "Going cycling in rain"]], "gr": [["Lucas is into ___ coins.", "collecting", "collect", "to collect"], ["Emma detests ___ in queues.", "waiting", "wait", "to waiting"], ["Mia doesn't mind ___ the dishes.", "washing", "wash", "to wash"], ["Emma loves ___ the piano.", "to play", "play", "plays"], ["I prefer ___ at home on rainy days.", "to stay", "stay", "stays"]], "wf": [["LIKE", "dislike", "I ___ cooking, unlike Mia."], ["COLLECT", "collection", "Lucas has a coin ___ ."], ["MUSIC", "musician", "Emma hopes to become a ___ ."], ["INTEREST", "interested", "She is ___ in music."], ["COOK", "cooking", "Mia loves ___ for her friends."], ["ENJOY", "enjoyment", "Music gives Emma a lot of ___ ."], ["PATIENT", "impatient", "The long queue made him ___ ."], ["COLLECT", "collector", "A coin ___ visited our school."], ["BAKE", "baking", "Mia spends Sunday afternoons ___ cakes."], ["USUAL", "unusual", "Lucas showed me a rather ___ coin."]], "chunks": [["I dislike cooking, and I detest waiting in queues when I go shopping.", "Tôi không thích nấu ăn và ghét xếp hàng khi đi mua sắm.", ["I dislike cooking,", "and I detest waiting in queues", "when I go shopping."]], ["I love to play the piano, especially when nobody is listening!", "Tôi rất thích chơi piano, nhất là khi không ai nghe!", ["I love to", "play the piano,", "especially when nobody is listening!"]], ["Oliver is into collecting stamps and coins from countries he has visited.", "Oliver mê sưu tầ stamps and coins**, particularly old coins from abroad. Each one tells a little story about the country it comes from.", "I'm probably most like Emma because I'm **interested in music** and love to **play the piano**. However, unlike her, I enjoy cooking for my family.", "I **dislike cooking** when I'm in a hurry, and I hate waiting in queues when I **go shopping**. I'd rather spend that time outside."], "drills": [["Oliver is ________ from countries he has visited.", "into collecting stamps and coins"], ["If you're ________, there's a free concert in the park.", "interested in music"], ["My cousin learnt to ________ by practising a little every day.", "play the piano"], ["I ________ when the kitchen is crowded.", "dislike cooking"], ["Let's ________ before the shops close.", "go shopping"], ["________ is messy, but the results are usually worth it.", "Baking cakes"]]}, {"title": "A Hobby with a Difference", "genre": "Personal Blog", "p": [{"en": "My Saturday afternoons used to follow the same pattern: lunch, a few hours of **video games** and perhaps a short walk. I enjoyed the routine, but after a while, I felt ready for something different.", "vi": "Những chiều thứ Bảy của tôi từng theo một lịch quen thuộc: ăn trưa, chơi game vài giờ và có thể đi dạo một chút. Tôi thích thói quen ấy, nhưng sau một thời gian, tôi muốn thử điều khác."}, {"en": "That's how I discovered a local **volunteer club**. Some members help younger children with their homework, while others prepare meals for elderly people. Since I'm **keen on doing DIY**, I joined the group responsible for making decorations for community events.", "vi": "Đó là cách tôi biết đến câu lạc bộ tình nguyện địa phương. Một số thành viên giúp trẻ nhỏ làm bài, những người khác chuẩn bị bữa ăn cho người cao tuổi. Vì thích tự làm đồ, tôi tham gia nhóm phụ trách trang trí sự kiện cộng đồng."}, {"en": "Our latest project involved learning how to **make paper flowers** from recycled materials. Some of my first flowers looked rather strange, but nobody seemed to mind. The enjoyable part was **working together** and **sharing ideas**.", "vi": "Dự án gần đây nhất là học làm hoa giấy từ vật liệu tái chế. Một số bông hoa đầu tiên của tôi khá kỳ lạ nhưng dường như không ai bận tâm. Điều thú vị là cùng làm việc và chia sẻ ý tưởng."}, {"en": "I still like playing games, reading and meeting friends. **Volunteering** hasn't replaced my other hobbies; it has simply added something new to my weekends. If you fancy trying a different leisure activity, a volunteer club might be worth exploring.", "vi": "Tôi vẫn thích chơi game, đọc sách và gặp bạn bè. Hoạt động tình nguyện không thay thế các sở thích khác mà chỉ thêm điều mới vào cuối tuần. Nếu bạn muốn thử hoạt động giải trí khác, câu lạc bộ tình nguyện có thể đáng để tìm hiểu."}], "v": [{"en": "video games", "vi": "trò chơi điện tử", "kind": "vocab", "context": "My Saturday afternoons used to follow the same pattern: lunch, a few hours of video games and perhaps a short walk. I enjoyed the routine, but after a while, I felt ready for something different.", "contextvi": "Những chiều thứ Bảy của tôi từng theo một lịch quen thuộc: ăn trưa, chơi game vài giờ và có thể đi dạo một chút. Tôi thích thói quen ấy, nhưng sau một thời gian, tôi muốn thử điều khác.", "example": "We agreed to turn off our video games before dinner.", "examplevi": "Chúng tôi đồng ý tắt trò chơi điện tử trước bữa tối."}, {"en": "volunteer club", "vi": "câu lạc bộ tình nguyện", "kind": "vocab", "context": "That's how I discovered a local volunteer club. Some members help younger children with their homework, while others prepare meals for elderly people. Since I'm keen on doing DIY, I joined the group responsible for making decorations for community events.", "contextvi": "Đó là cách tôi biết đến câu lạc bộ tình nguyện địa phương. Một số thành viên giúp trẻ nhỏ làm bài, những người khác chuẩn bị bữa ăn cho người cao tuổi. Vì thích tự làm đồ, tôi tham gia nhóm phụ trách trang t u hoạch nhanh hơn trước. Thời tiết mùa ấy thuận lợi và nông dân vui mừng vì được mùa bội thu."}, {"en": "By midday, several workers were **loading a truck with sacks of rice**. I offered to help, although the sacks were considerably heavier than they looked. When we arrived at the storage building, we began **unloading the truck**.", "vi": "Đến trưa, vài công nhân đang chất bao gạo lên xe tải. Tôi đề nghị giúp dù các bao nặng hơn vẻ ngoài rất nhiều. Khi đến kho, chúng tôi bắt đầu dỡ hàng khỏi xe."}, {"en": "The afternoon was more relaxing. My cousins took me to their father's **orchard**, where we **picked fruit** and rested beneath the trees. That evening, I was too tired even to finish my dinner. I had never fallen asleep so quickly.", "vi": "Buổi chiều thư thái hơn. Các anh chị em họ đưa tôi đến vườn cây ăn quả của bố họ, nơi chúng tôi hái trái cây và nghỉ dưới bóng cây. Tối ấy tôi mệt đến mức không ăn hết bữa tối. Tôi chưa bao giờ ngủ nhanh như vậy."}], "v": [{"en": "combine harvester", "vi": "máy gặt đập liên hợp", "kind": "vocab", "context": "The sound of a combine harvester woke me just before sunrise. I was staying on my uncle's rice farm, where harvest time meant getting up earlier than usual. By the time I reached the kitchen, everyone else had already eaten breakfast.", "contextvi": "Tiếng máy gặt đập liên hợp đánh thức tôi ngay trước bình minh. Tôi đang ở trang trại lúa của bác, nơi mùa gặt đồng nghĩa với việc dậy sớm hơn thường lệ. Khi tôi đến bếp, mọi người đã ăn sáng xong.", "example": "A combine harvester can collect and separate grain in one operation.", "examplevi": "Máy gặt đập liên hợp có thể thu hoạch và tách hạt trong một lần vận hành."}, {"en": "harvest time", "vi": "mùa thu hoạch", "kind": "vocab", "context": "The sound of a combine harvester woke me just before sunrise. I was staying on my uncle's rice farm, where harvest time meant getting up earlier than usual. By the time I reached the kitchen, everyone else had already eaten breakfast.", vkFJ+3ndZgeR5Y2xQgs0ZfiDcJebJF1hV/UAAAA==", "models": ["During **harvest time**, farmers get up **earlier than usual** to collect their crops. If the weather has been good, they may have a bumper crop.", "A **combine harvester** helps farmers collect grain **more quickly than before**. Machines also make loading and unloading a truck less tiring.", "I'd enjoy working in an **orchard** and picking fruit, but I wouldn't enjoy **loading a truck with sacks of rice**. That job looks quite tiring!"], "drills": [["With enough rain, farmers hope to ________ this year.", "have a bumper crop"], ["Two workers were ________ behind the warehouse.", "loading a truck with sacks of rice"], ["We finished ________ just before the storm arrived.", "unloading the truck"], ["The visitors ________ and paid for it at the gate.", "picked fruit"]]}, {"title": "Where the Fields Meet the Sky", "genre": "Descriptive Text", "p": [{"en": "At sunrise, a thin layer of mist covers the **vast paddy fields** that **stretch to the horizon**. Beyond them are green hills, narrow country paths and small houses with vegetable gardens. Near the river stands a stone **cottage surrounded by trees and flowers**.", "vi": "Lúc bình minh, một lớp sương mỏng phủ những cánh đồng lúa bạt ngàn trải đến chân trời. Xa hơn là đồi xanh, đường quê hẹp và những ngôi nhà nhỏ có vườn rau. Gần sông là một căn nhà đá nhỏ được bao quanh bởi cây và hoa."}, {"en": "The village gradually comes to life. Farmers begin to **plough the fields** or **herd buffaloes and cows**, while children help their parents **collect eggs** before leaving for school. The sound of birds replaces the noise of city traffic.", "vi": "Ngôi làng dần thức giấc. Nông dân bắt đầu cày ruộng hoặc chăn trâu bò, còn trẻ em giúp cha mẹ nhặt trứng trước khi đi học. Tiếng chim thay cho tiếng xe cộ thành phố."}, {"en": "Visitors often come to admire the **picturesque scenery**. The air is relatively **unpolluted**, and the surrounding countryside is rich in **wildlife**. Walking along the river provides an opportunity to enjoy some **peace and quiet**.", "vi": "Du khách thường đến ngắm phong cảnh đẹp như tranh. Không khí tương đối trong lành và vùng quê xung quanh có nhiều động vật hoang dã. Đi bộ ven sông giúp tận hưởng sự yên bình và tĩnh lặng."}, {"en": "The local people are **friendly and hospitable**, with a strong **sense of community**. Neighbours regularly stop to talk and help one another. With its slower **pace of life**, the village offers a welcome combination of **peace and relaxation**.", "vi": "Người dân thân thiện và hiếu khách, có tinh thần cộng đồng mạnh mẽ. Hàng xóm thường dừng lại trò chuyện và giúp nhau. Với nhịp sống chậm hơn, ngôi làng mang lại sự thanh bình và thư thái."}], "v": [{"en": "vast paddy fields", "vi": "những cánh đồng lúa bạt ngàn", "kind": "vocab", "context": "At sunrise, a thin layer of mist covers the vast paddy fields that stretch to the horizon. Beyond them are green hills, narrow country paths and small houses with vegetable gardens. Near the river stands a stone cottage surrounded by trees and flowers.", "contextvi": "Lúc bình minh, một lớp sương mỏng phủ những cánh đồng lúa bạt ngàn trải đến chân trời. Xa hơn là đồi xanh, đường quê hẹp và những ngôi nhà nhỏ có vườn rau. Gần sông là một căn nhà đá nhỏ được bao quanh bởi cây và hoa.", "example": "From the hilltop, we could see vast paddy fields below.", "examplevi": "Từ đỉnh đồi, chúng tôi nhìn thấy những cánh đồng lúa bạt ngàn bên dưới."}, {"en": "stretch to the horizon", "vi": "trải dài đến chân trời", "kind": "colloc", "context": "At sunrise, a thin layer of mist covers the vast paddy fields that stretch to the horizon. Beyond them are green hills, narrow country paths and small houses with vegetable gardens. Near the river stands a stone cottage surrounded by trees and flowers.", "contextvi": "Lúc bình minh, một lớp sương mỏng phủ những cánh đồng lúa bạt ngàn trải đến chân trời. Xa hơn là đồi xanh, đường quê hẹp và những ngôi nhà y has certainly changed rural life, but farming still depends on patience, practical skills and good judgement.", "contextvi": "An toàn cũng quan trọng không kém. Người vận hành máy móc có trách nhiệm hơn người khác ít có khả năng gây tai nạn. Người làm việc bất cẩn hơn có thể gây nguy hiểm cho mình và người khác. Công nghệ đã thay đổi đời sống nông thôn nhưng nông nghiệp vẫn phụ thuộc vào kiên nhẫn, kỹ năng thực hành và phán đoán tốt.", "example": "She uses her pocket money more responsibly than she used to.", "examplevi": "Cô sử dụng tiền tiêu vặt có trách nhiệm hơn trước."}, {"en": "more carelessly", "vi": "bất cẩn hơn", "kind": "grammar", "context": "Safety is equally important. People who operate machinery more responsibly than others are less likely to cause accidents. Those who work more carelessly may put themselves and others at risk. Technology has certainly changed rural life, but farming still depends on patience, practical skills and good judgement.", "contextvi": "An toàn cũng quan trọng không kém. Người vận hành máy móc có trách nhiệm hơn người khác ít có khả năng gây tai nạn. Người làm việc bất cẩn hơn có thể gây nguy hiểm cho mình và người khác. Công nghệ đã thay đổi đời sống nông thôn nhưng nông nghiệp vẫn phụ thuộc vào kiên nhẫn, kỹ năng thực hành và phán đoán tốt.", "example": "He drove more carelessly when he was tired.", "examplevi": "Anh lái xe bất cẩn hơn khi mệt."}], "mc": [["What has modern equipment changed?", "The speed and methods of farm work", "The need for food", "The weather"], ["What can muddy roads affect?", "Transportation", "The colour of livestock", "The length of the day"], ["What does farming still depend on?", "Knowledge and practical skills", "Machines alone", "Good luck alone"]], "gr": [["Experienced farmers work ___ than beginners.", "more carefully", "carefullier", "more careful"], ["It rained ___ than expected.", "more heavily", "heavilier", "more heavy"], ["Workers should operate machines ___ than before.", "more responsibly", "responsiblier", "more responsible"], ["He works ___ than his colleague.", "more carelessly", "carelesslier", "more careless"], ["Modern machines work ___ than old ones.", "faster", "more fast", "fastest"]], "wf": [["CARE", "carefully", "Farmers should operate machines ___ ."], ["RESPONSIBLE", "responsibly", "Use the equipment ___ ."], ["HEAVY", "heavily", "It rained ___ yesterday."], ["SAFE", "safety", "___ is important on farms."], ["TRANSPORT", "transportation", "Muddy roads make ___ difficult."], ["EQUIP", "equipment", "Farmers need reliable ___ ."], ["RESPONSIBLE", "irresponsible", "Leaving machinery running unattended is ___ ."], ["EFFICIENT", "efficiently", "The new machine works more ___ ."], ["PRACTICE", "practical", "Farming requires ___ skills."], ["AGRICULTURE", "agricultural", "The town sells ___ products at its weekly market."]], "chunks": [["Modern agricultural equipment has changed how farmers cultivate crops.", "Thiết bị nông nghiệp hiện đại đã thay đổi cách nông dân canh tác.", ["Modern agricultural equipment", "has changed", "how farmers cultivate crops."]], ["Experienced farmers often organise feeding routines more carefully than beginners.", "Nông dân có kinh nghiệm thường tổ chức cho ăn cẩn thận hơn người mới.", ["Experienced farmers", "often organise feeding routines", "more carefully than", "beginners."]], ["People cultivate crops on the flat land near the river.", "Người dân canh tác cây trồng trên vùng đất bằng gần sông.", ["People cultivate crops", "on the flat land", "near the river."]], ["Families in the valley raise livestock as well as growing vegetables.", "Các gia đình trong thung lũng nuôi gia súc bên cạnh việc trồng rau.", ["Families in the valley", "raise livestock", "as well as growing vegetables."]], ["Workers load trucks with timber at the edge of the forest.", "Công nhân chất gỗ lên xe tải ở rìa rừng.", ["Workers", "load trucks with timber", "at the edge of the forest."]]], "output": ["How do machines help farmers?", " a small mixed farm. We spoke to him while he was finishing his morning jobs.", "vi": "Ông Harris điều hành một trang trại hỗn hợp nhỏ. Chúng tôi trò chuyện với ông khi ông hoàn thành công việc buổi sáng."}, {"en": "Reporter: Is your working day always this busy?\nMr Harris: Usually. I've already **fed the pigs and chickens**, collected the eggs and checked the animals.", "vi": "Phóng viên: Ngày làm việc của ông luôn bận như thế sao?\nÔng Harris: Thường là vậy. Tôi đã cho lợn và gà ăn, nhặt trứng và kiểm tra vật nuôi."}, {"en": "Reporter: What are the larger animals doing outside?\nMr Harris: We **raise cows**, keep sheep and have several horses. My daughter helps me **herd sheep** and occasionally **herd horses** into another field.", "vi": "Phóng viên: Những con vật lớn ngoài kia đang làm gì?\nÔng Harris: Chúng tôi nuôi bò, cừu và vài con ngựa. Con gái giúp tôi chăn cừu và thỉnh thoảng lùa ngựa sang cánh đồng khác."}, {"en": "Reporter: Do you grow your own vegetables?\nMr Harris: Yes. We grow beans, and you can **pick some tomatoes** before you leave.", "vi": "Phóng viên: Ông có tự trồng rau không?\nÔng Harris: Có. Chúng tôi trồng đậu và bạn có thể hái cà chua trước khi về."}, {"en": "Reporter: What other jobs need doing?\nMr Harris: We sometimes **collect wood** and **dig holes to plant trees**. Even the farm cats have a job: they **catch mice**!", "vi": "Phóng viên: Còn công việc nào khác?\nÔng Harris: Đôi khi chúng tôi nhặt củi và đào hố trồng cây. Ngay cả mèo cũng có việc: chúng bắt chuột!"}, {"en": "Reporter: What do you offer visitors?\nMr Harris: They can **ride a horse** with an instructor or walk through the orchard.", "vi": "Phóng viên: Du khách có thể làm gì?\nÔng Harris: Họ có thể cưỡi ngựa với người hướng dẫn hoặc đi dạo qua vườn cây."}, {"en": "Reporter: And when do you get a day off?\nMr Harris: Ask the animals!", "vi": "Phóng viên: Vậy khi nào ông được nghỉ?\nÔng Harris: Hãy hỏi các con vật!"}], "v": [{"en": "fed the pigs and chickens", "vi": "cho lợn và gà ăn", "kind": "colloc", "context": "Reporter: Is your working day always this busy?\nMr Harris: Usually. I've already fed the pigs and chickens, collected the eggs and checked the animals.", "contextvi": "Phóng viên: Ngày làm việc của ông luôn bận như thế sao?\nÔng Harris: Thường là vậy. Tôi đã cho lợn và gà ăn, nhặt trứng và kiểm tra vật nuôi.", "example": "The children fed the pigs and chickens before breakfast.", "examplevi": "Bọn trẻ cho lợn và gà ăn trước bữa sáng."}, {"en": "raise cows", "vi": "nuôi bò", "kind": "colloc", "context": "Reporter: What are the larger animals doing outside?\nMr Harris: We raise cows, keep sheep and have several horses. My daughter helps me herd sheep and occasionally herd horses into another field.", "contextvi": "Phóng viên: Những con vật lớn ngoài kia đang làm gì?\nÔng Harris: Chúng tôi nuôi bò, cừu và vài con ngựa. Con gái giúp tôi chăn cừu và thỉnh thoảng lùa ngựa sang cánh đồng khác.", "example": "Some farmers raise cows for milk rather than meat.", "examplevi": "Một số nông dân nuôi bò lấy sữa thay vì lấy thịt."}, {"en": "herd sheep", "vi": "chăn cừu", "kind": "colloc", "context": "Reporter: What are the larger animals doing outside?\nMr Harris: We raise cows, keep sheep and have several horses. My daughter helps me herd sheep and occasionally herd horses into another field.", "contextvi": "Phóng viên: Những con vật lớn ngoài kia đang làm gì?\nÔng Harris: Chúng tôi nuôi bò, cừu và vài con ngựa. Con gái giúp tôi chăn cừu và thỉnh thoảng lùa ngựa sang cánh đồng khác.", "example": "A well-trained dog can help its owner herd sheep.", "examplevi": "Chó được huấn luyện tốt có thể giúp chủ lùa cừu."}, {"en": "herd horses", "vi": "lùa ngựa", "kind": "colloc", "context": "Reporter: What are the larger animals doing outside?\nMr Harris: We raise cows, keep sheep and have several horses. My daughter helps me herd sheep and occasionally herd horses into another field.", "contextvi": "Phóng viên: Những con vật lớn ngoài kia đang làm gì?\nÔng Harris: Chúng tôi nuôi bò, cừu và vài con ngựa. Con gái giúp tôi chăn cừu và thỉnh thoảng lùa ngựa sang cánh đồng khác.", "example": "The farm workers herd horses into the yard before dark.", "examplevi": "Công nhân trang trại lùa ngựa vào sân trước khi trời tối."}, {"en": "pick some tomatoes", "vi": "hái cà chua", "kind": "colloc", "context": "Reporter: Do you grow your own vegetables?\nMr Harris: Yes. We grow beans, and you can pick some tomatoes before you leave.", "contextvi": "Phóng viên: Ông có tự trồng rau không?\nÔng Harris: Có. Chúng tôi trồng đậu và bạn có thể hái cà chua trước khi về.", "example": "Could you pick some tomatoes for the salad?", "examplevi": "Bạn hái vài quả cà chua làm salad được không?"}, {"en": "collect wood", "vi": "nhặt củi", "kind": "colloc", "context": "Reporter: What other jobs need doing?\nMr Harris: We sometimes collect wood and dig holes to plant trees. Even the farm cats have a job: they catch mice!", "contextvi": "Phóng viên: Còn công việc nào khác?\nÔng Harris: Đôi khi chúng tôi nhặt củi và đào hố trồng cây. Ngay cả mèo cũng có việc: chúng bắt chuột!", "example": "We collect wood from fallen branches, not living trees.", "examplevi": "Chúng tôi nhặt củi từ cành cây rụng, không lấy từ cây sống."}, {"en": "dig holes to plant trees", "vi": "đào hố trồng cây", "kind": "colloc", "context": "Reporter: What other jobs need doing?\nMr Harris: We sometimes collect wood and dig holes to plant trees. Even the farm cats have a job: they catch mice!", "contextvi": "Phóng viên: Còn công việc nào khác?\nÔng Harris: Đôi khi chúng tôi nhặt củi và đào hố trồng cây. Ngay cả mèo cũng có việc: chúng bắt chuột!", "example": "Volunteers dig holes to plant trees along the school fence.", "examplevi": "Các tình nguyện viên đào hố trồng cây dọc hàng rào trường."}, {"en": "catch mice", "vi": "bắt chuột", "kind": "colloc", "context": "Reporter: What other jobs need doing?\nMr Harris: We sometimes collect wood and dig holes to plant trees. Even the farm cats have a job: they catch mice!", "contextvi": "Phóng viên: Còn công việc nào khác?\nÔng Harris: Đôi khi chúng tôi nhặt củi và đào hố trồng cây. Ngay cả mèo cũng có việc: chúng bắt chuột!", "example": "Owls often catch mice in open fields at night.", "examplevi": "Cú thường bắt chuột trên cánh đồng vào ban đêm."}, {"en": "ride a horse", "vi": "cưỡi ngựa", "kind": "colloc", "context": "Reporter: What do you offer visitors?\nMr Harris: They can ride a horse with an instructor or walk through the orchard.", "contextvi": "Phóng viên: Du khách có thể làm gì?\nÔng Harris: Họ có thể cưỡi ngựa với người hướng dẫn hoặc đi dạo qua vườn cây.", "example": "My sister was nervous when she first learnt to ride a horse.", "examplevi": "Em gái tôi lo lắng khi lần đầu học cưỡi ngựa."}], "mc": [["What does Mr Harris do first?", "Look after the animals", "Go shopping", "Teach at school"], ["What does his daughter help with?", "Herding animals", "Driving a bus", "Selling books"], ["What can visitors do?", "Ride a horse with an instructor", "Drive any tractor alone", "Milk all cows without help"]], "gr": [["Mr Harris gets up ___ than most visitors.", "earlier", "more early", "earliest"], ["His daughter rides ___ than beginners.", "better", "more well", "gooder"], ["The cats move ___ than the pigs.", "faster", "more fast", "fastest"], ["Visitors should ride ___ than experienced riders.", "more carefully", "carefullier", "more careful"], ["The farm is ___ from town than my home.", "farther", "more far", "farthest"]], "wf": [["FARM", "farmer", "Mr Harris is a ___ ."], ["COLLECT", "collecting", "The children enjoy ___ eggs."], ["CARE", "carefully", "Ride the horse ___ ."], ["VISIT", "visitors", "The farm welcomes many ___ ."], ["INSTRUCT", "instructor", "You can ride with an ___ ."], ["TRAIN", "trained", "A well-___ dog can herd sheep."], ["GROW", "growth", "Warm weather encourages plant ___ ."], ["DAILY", "daily", "Feeding the animals is a ___ task."], ["REPAIR", "repairs", "Th bxKb8aDexqRkF7Wcu1LK5y2YnkrAQpznlS+s8DPx9GNQIHdZjPnoTPLbDC52DxgAum2LTfLfPVJ0kmbH3A2efBVIf8VZfEXjJsJfd6ytjCNjofvH0CjuKb6uwsYAA", "models": ["Farmers need to **feed the pigs and chickens**, collect eggs and check the animals every day. They may also **herd sheep** into a different field.", "I'd like to **ride a horse** with an instructor or **pick some tomatoes** in the garden. I've never done either on a real farm.", "Animals need food, water and a safe place to live. People who **raise cows** or **herd horses** have to check them even at weekends."], "drills": [["The children ________ before breakfast.", "fed the pigs and chickens"], ["Some farmers ________ for milk rather than meat.", "raise cows"], ["A well-trained dog can help its owner ________.", "herd sheep"], ["The farm workers ________ into the yard before dark.", "herd horses"], ["Could you ________ for the salad?", "pick some tomatoes"], ["We ________ from fallen branches, not living trees.", "collect wood"], ["Volunteers ________ along the school fence.", "dig holes to plant trees"], ["Owls often ________ in open fields at night.", "catch mice"], ["My sister was nervous when she first learnt to ________.", "ride a horse"]]}, {"title": "Is Country Life Really Better?", "genre": "Blog / Opinion", "p": [{"en": "Would you exchange a shopping centre for an open field? I probably would. Growing up in the countryside, I spent my afternoons **flying kites**, **picking flowers** and **riding a bicycle** along quiet country paths.", "vi": "Bạn có đổi trung tâm mua sắm lấy một cánh đồng rộng không? Có lẽ tôi sẽ đổi. Lớn lên ở nông thôn, tôi dành các buổi chiều thả diều, hái hoa và đạp xe trên đường quê yên tĩnh."}, {"en": "There was always something to do. We would **catch fish**, **pick blackberries** or help our grandparents **collect water** from a well. We sometimes saw foxes trying to **catch rabbits**. On a farm holiday abroad, I even watched children **ride buffaloes** while their parents were busy **cultivating rice and beans**.", "vi": "Luôn có việc để làm. Chúng tôi bắt cá, hái quả mâm xôi hoặc giúp ông bà lấy nước từ giếng. Đôi lúc chúng tôi thấy cáo cố bắt thỏ. Trong kỳ nghỉ ở trang trại nước ngoài, tôi còn thấy trẻ em cưỡi trâu trong khi cha mẹ trồng lúa và đậu."}, {"en": "Of course, rural life has disadvantages. My father has to **commute** to work, and we travel **further than** town residents to reach certain services. My cousin speaks English **more fluently than** I do, so he often helps foreign visitors.", "vi": "Tất nhiên đời sống nông thôn có bất lợi. Bố tôi phải đi lại đến nơi làm việc, và chúng tôi đi xa hơn cư dân thị trấn để sử dụng một số dịch vụ. Anh họ nói tiếng Anh trôi chảy hơn tôi nên thường giúp du khách nước ngoài."}, {"en": "Nevertheless, I sleep **worse in the city than in the countryside** and always sleep **better** at home. For me, being **closer to nature** and enjoying a **healthier lifestyle** are worth a few inconveniences.", "vi": "Dù vậy, tôi ngủ kém hơn ở thành phố so với nông thôn và luôn ngủ ngon hơn ở nhà. Với tôi, gần gũi thiên nhiên và có lối sống lành mạnh hơn đáng để chấp nhận vài bất tiện."}], "v": [{"en": "flying kites", "vi": "thả diều", "kind": "colloc", "context": "Would you exchange a shopping centre for an open field? I probably would. Growing up in the countryside, I spent my afternoons flying kites, picking flowers and riding a bicycle along quiet country paths.", "contextvi": "Bạn có đổi trung tâm mua sắm lấy một cánh đồng rộng không? Có lẽ tôi sẽ đổi. Lớn lên ở nông thôn, tôi dành các buổi chiều thả diều, hái hoa và đạp xe trên đường quê yên tĩnh.", "example": "Flying kites is much easier when the wind is steady.", "examplevi": "Thả diều dễ hơn nhiều khi gió thổi đều."}, {"en": "picking flowers", "vi": "hái hoa", "kind": "colloc", "context": "Would you exchange a shopping centre for an open field? I probably would. Growing up in the countryside, I spent my afternoons flying kites, picking flowers and riding a bicyc member of the basketball club"], ["Group projects give me a chance to ________.", "mix with my classmates"], ["It took me a few weeks to ________.", "fit into the group"], ["They ________: a love of old films.", "had something in common"], ["Changing schools can be an opportunity to ________.", "make new friends"], ["Practising my speech aloud helps me ________.", "feel more confident"], ["Three students ________ to raise money for charity.", "signed up for a sporting event"], ["I'm ________ the progress you've made since September.", "proud of"]]}, {"title": "Inside a Teenager's Routine", "genre": "Descriptive Profile", "p": [{"en": "For fifteen-year-old Sophie, mornings are a mixture of schoolbooks, breakfast and messages from friends. Her phone is usually full of **notifications**, but she prefers to get dressed before checking them. By eight o'clock, she is already sitting in her classroom.", "vi": "Với Sophie mười lăm tuổi, buổi sáng là sự kết hợp của sách vở, bữa sáng và tin nhắn bạn bè. Điện thoại thường đầy thông báo nhưng cô thích mặc quần áo trước khi kiểm tra. Đến tám giờ, cô đã ngồi trong lớp."}, {"en": "Her school day is rarely quiet. There are lessons to attend, projects to complete and information to find by **browsing websites**. Lunchtime offers a welcome opportunity for a little **chit-chat** with her friends and classmates.", "vi": "Ngày học của cô hiếm khi yên ả. Có các tiết học, dự án cần hoàn thành và thông tin cần tìm bằng cách lướt trang web. Giờ ăn trưa là dịp để trò chuyện với bạn bè và bạn cùng lớp."}, {"en": "Like many teenagers, Sophie experiences **pressure from schoolwork**. She sometimes **feels stressed**, particularly before examinations. Good **time management** helps her **concentrate on her studies** without spending the entire evening at her desk.", "vi": "Như nhiều thanh thiếu niên, Sophie chịu áp lực học tập. Cô đôi khi căng thẳng, đặc biệt trước kỳ thi. Quản lý thời gian tốt giúp cô tập trung học mà không phải ngồi bàn cả tối."}, {"en": "Her older sister is an important **role model**. She manages her responsibilities while making time for music and friendships. Sophie follows a similar routine. At half past seven, the schoolbooks disappear, the guitar comes out, and the busiest part of her day is over.", "vi": "Chị gái là tấm gương quan trọng. Chị quản lý trách nhiệm đồng thời dành thời gian cho âm nhạc và tình bạn. Sophie theo lịch tương tự. Lúc bảy giờ rưỡi, sách vở được cất đi, đàn guitar xuất hiện và phần bận nhất trong ngày đã kết thúc."}], "v": [{"en": "notifications", "vi": "thông báo", "kind": "vocab", "context": "For fifteen-year-old Sophie, mornings are a mixture of schoolbooks, breakfast and messages from friends. Her phone is usually full of notifications, but she prefers to get dressed before checking them. By eight o'clock, she is already sitting in her classroom.", "contextvi": "Với Sophie mười lăm tuổi, buổi sáng là sự kết hợp của sách vở, bữa sáng và tin nhắn bạn bè. Điện thoại thường đầy thông báo nhưng cô thích mặc quần áo trước khi kiểm tra. Đến tám giờ, cô đã ngồi trong lớp.", "example": "Turn off notifications before you start the exam.", "examplevi": "Hãy tắt thông báo trước khi bắt đầu kỳ thi."}, {"en": "browsing websites", "vi": "lướt các trang web", "kind": "colloc", "context": "Her school day is rarely quiet. There are lessons to attend, projects to complete and information to find by browsing websites. Lunchtime offers a welcome opportunity for a little chit-chat with her friends and classmates.", "contextvi": "Ngày học của cô hiếm khi yên ả. Có các tiết học, dự án cần hoàn thành và thông tin cần tìm bằng cách lướt trang web. Giờ ăn trưa là dịp để trò chuyện với bạn bè và bạn cùng lớp.", "example": "I spent the afternoon browsing websites for a second-hand bicycle.", "examplevi": "Tôi dành buổi chiều lướt các trang web tìm xe đạp cũ."}, {"en": "chit-chat", "vi": "tán gẫu", "kind": "vocab", "context": "Her school day is rarely quiet. There are lessons to atte 0M0urs0BWwYrC8v8OPNZi0Nvye4xMxgAuDNB9dMj8nFsSZo497pjDwSDIv7wOzxGOt0AnwFOfwglNEPsN1Zod1AAMMRKKsAYcY0JCQfnjnikY/bWo2B+AfclrB/zoQc2u8taT/yz6XluCcYmIGXHCuKScNBHYRHa0bM1Yhu8lmdhEaHrzxeqx2kEjhrefCQkNIoQ/B4wT7NRpqWHKhp5rjpFYo6jolH7gO8xloOw+HGt6R+EZZaWa9107OzvwH92YEGOOZjiWaIL996yxP/8km7SmRqBBywWDCnwQCQlAhvd0q0iha0oAA==", "models": ["I get up early and usually **check notifications** after breakfast. At school, I enjoy a little **chit-chat** with friends before lessons begin.", "Good **time management** helps me **concentrate on my studies**. I put my phone away while I work so that I can finish earlier.", "My older sister is my **role model**. She deals with **pressure from schoolwork** calmly and still makes time for her hobbies."], "drills": [["I spent the afternoon ________ for a second-hand bicycle.", "browsing websites"], ["When Leo ________, he takes a short walk.", "feels stressed"], ["A quiet desk helps Sophie ________.", "concentrate on her studies"]]}, {"title": "Under Pressure", "genre": "Magazine Article", "p": [{"en": "Getting good marks, maintaining friendships and making decisions about the future can be challenging. For some young people, these everyday responsibilities gradually develop into **teen stress**.", "vi": "Đạt điểm tốt, duy trì tình bạn và đưa ra quyết định về tương lai có thể là thách thức. Với một số người trẻ, những trách nhiệm hằng ngày dần phát triển thành căng thẳng tuổi teen."}, {"en": "Students may struggle to **meet their parents' expectations** or find it difficult to **work under pressure**. Others **experience peer pressure** because they want to be accepted by their friends. Some begin to **worry about their appearance**, especially when they compare themselves with images on social media.", "vi": "Học sinh có thể khó đáp ứng kỳ vọng của cha mẹ hoặc khó làm việc dưới áp lực. Những em khác chịu áp lực đồng trang lứa vì muốn được bạn bè chấp nhận. Một số bắt đầu lo về ngoại hình, nhất là khi so sánh bản thân với hình ảnh trên mạng xã hội."}, {"en": "Bullying can make these problems worse. Teenagers should not blame themselves, nor should they feel that they have to **deal with a bully** alone. Seeking support is important, for ignoring the problem may allow it to continue.", "vi": "Bắt nạt có thể khiến các vấn đề nghiêm trọng hơn. Thanh thiếu niên không nên tự trách mình, cũng không nên nghĩ rằng phải một mình đối phó với kẻ bắt nạt. Tìm sự hỗ trợ rất quan trọng vì phớt lờ vấn đề có thể khiến nó tiếp diễn."}, {"en": "Schools can encourage students to **discuss the causes of stress** and discover healthy ways to **deal with stress**. Young people can **get advice from their peers**, or they can talk to a trusted adult. Learning to **be confident in their abilities** is just as important as achieving good results.", "vi": "Trường học có thể khuyến khích học sinh thảo luận nguyên nhân căng thẳng và tìm cách lành mạnh để đối phó. Người trẻ có thể nhận lời khuyên từ bạn đồng trang lứa hoặc trò chuyện với người lớn đáng tin cậy. Học cách tự tin vào khả năng quan trọng không kém việc đạt kết quả tốt."}], "v": [{"en": "teen stress", "vi": "căng thẳng tuổi thanh thiếu niên", "kind": "vocab", "context": "Getting good marks, maintaining friendships and making decisions about the future can be challenging. For some young people, these everyday responsibilities gradually develop into teen stress.", "contextvi": "Đạt điểm tốt, duy trì tình bạn và đưa ra quyết định về tương lai có thể là thách thức. Với một số người trẻ, những trách nhiệm hằng ngày dần phát triển thành căng thẳng tuổi teen.", "example": "A school counsellor can help students recognise the signs of teen stress.", "examplevi": "Chuyên viên tư vấn học đường có thể giúp học sinh nhận biết dấu hiệu căng thẳng tuổi teen."}, {"en": "meet their parents' expectations", "vi": "đáp ứng kỳ vọng của cha mẹ", "kind": "colloc", "context": "Students may struggle to meet their parents' expectations or find it difficult to work under pressure. Others experience peer pressure because they want to be accepted by their friends. Some begin to worry about their appearance, especially when they compare themselves with images on social media.", "contextvi": "Học sinh có thể khó đáp ứng kỳ vọng của cha mẹ hoặc khó làm việc dưới áp lực. Những em khác chịu áp lực đồng trang lứa vì muốn được bạn bè chấp nhận. Một số bắt đầu lo về ngoại hình, nhất là khi so sánh bản thân với hình ảnh trên mạng xã hội.", "example": "Some young athletes struggle to meet their parents' expectations.", "examplevi": "Một số vận động viên trẻ gặp khó khăn khi cố đáp ứng kỳ vọng của cha mẹ."}, {"en": "work under pressure", "vi": "làm việc dưới áp lực", "kind": "colloc", "context": "Students may struggle to meet their parents' expectations or find it difficult to work under pressure. Others experience peer pressure because they want to be accepted by their friends. Some begin to worry about their appearance, especially when they compare themselves with images on social media.", "contextvi": "Học sinh có thể khó đáp ứng kỳ vọng của cha mẹ hoặc khó làm việc dưới áp lực. Những em khác chịu áp lực đồng trang lứa vì muốn được bạn bè chấp nhận. Một số bắt đầu lo về ngoại hình, nhất là khi so sánh bản thân với hình ảnh trên mạng xã hội.", "example": "Emergency workers often have to work under pressure.", "examplevi": "Nhân viên cấp cứu thường phải làm việc dưới áp lực."}, {"en": "experience peer pressure", "vi": "chịu áp lực đồng trang lứa", "kind": "colloc", "context": "Students may struggle to meet their parents' expectations or find it difficult to work under pressure. Others experience peer pressure because they want to be accepted by their friends. Some begin to worry about their appearance, especially when they compare themselves with images on social media.", "contextvi": "Học sinh có thể khó đáp ứng kỳ vọng của cha mẹ hoặc khó làm việc dưới áp lực. Những em khác chịu áp lực đồng trang lứa vì muốn được bạn bè chấp nhận. Một số bắt đầu lo về ngoại hình, nhất là khi so sánh bản thân với hình ảnh trên mạng xã hội.", "example": "Teenagers may experience peer pressure when choosing what to wear.", "examplevi": "Thanh thiếu niên có thể chịu áp lực bạn bè khi chọn trang phục."}, {"en": "worry about their appearance", "vi": "lo lắng về ngoại hình", "kind": "colloc", "context": "Students may struggle to meet their parents' expectations or find it difficult to work under pressure. Others experience peer pressure because they want to be accepted by their friends. Some begin to worry about their appearance, especially when they compare themselves with images on social media.", "contextvi": "Học sinh có thể khó đáp ứng kỳ vọng của cha mẹ hoặc khó làm việc dưới áp lực. Những em khác chịu áp lực đồng trang lứa vì muốn được bạn bè chấp nhận. Một số bắt đầu lo về ngoại hình, nhất là khi so sánh bản thân với hình ảnh trên mạng xã hội.", "example": "Many teenagers worry about their appearance before a school party.", "examplevi": "Nhiều thanh thiếu niên lo lắng về ngoại hình trước buổi tiệc ở trường."}, {"en": "deal with a bully", "vi": "đối phó với kẻ bắt nạt", "kind": "colloc", "context": "Bullying can make these problems worse. Teenagers should not blame themselves, nor should they feel that they have to deal with a bully alone. Seeking support is important, for ignoring the problem may allow it to continue.", "contextvi": "Bắt nạt có thể khiến các vấn đề nghiêm trọng hơn. Thanh thiếu niên không nên tự trách mình, cũng không nên nghĩ rằng phải một mình đối phó với kẻ bắt nạt. Tìm sự hỗ trợ rất quan trọng vì phớt lờ vấn đề có thể khiến nó tiếp diễn.", "example": "You don't have to deal with a bully on your own.", "examplevi": "Bạn không cần đối phó với kẻ bắt nạt một mình."}, {"en": "discuss the causes of stress", "vi": "thảo luận nguyên nhân căng thẳng", "kind": "colloc", "context": "Schools can encourage students to discuss the causes of stress and discover healthy ways to deal with stress. Young people can get advice from their peers, or they can talk to a trusted adult. Learning to be confident in their abilities is just as important as achieving good results.", "contextvi": "Trường học có thể khuyến khích học sinh thảo luận nguyên nhân căng thẳng và tìm cách lành mạnh để đối phó. Người trẻ có thể nhận lời khuyên từ bạn đồng trang lứa hoặc trò chuyện với người lớn đáng tin cậy. Học cách tự tin vào khả năng quan trọng không kém việc đạt kết quả tốt.", "example": "The students met to discuss the causes of stress before exam week.", "examplevi": "Học sinh gặp nhau để thảo luận nguyên nhân căng thẳng trước tuần thi."}, {"en": "deal with stress", "vi": "đối phó căng thẳng", "kind": "colloc", "context": "Schools can encourage students to discuss the causes of stress and discover healthy ways to deal with stress. Young people can get advice from their peers, or they can talk to a trusted adult. Learning to be confident in their abilities is just as important as achieving good results.", "contextvi": "Trường học có thể khuyến khích học sinh thảo luận nguyên nhân căng thẳng và tìm cách lành mạnh để đối phó. Người trẻ có thể nhận lời khuyên từ bạn đồng trang lứa hoặc trò chuyện với người lớn đáng tin cậy. Học cách tự tin vào khả năng quan trọng không kém việc đạt kết quả tốt.", "example": "Going for a run is one way I deal with stress.", "examplevi": "Chạy bộ là một cách tôi đối phó với căng thẳng."}, {"en": "get advice from their peers", "vi": "nhận lời khuyên từ bạn đồng trang lứa", "kind": "colloc", "context": "Schools can encourage students to discuss the causes of stress and discover healthy ways to deal with stress. Young people can get advice from their peers, or they can talk to a trusted adult. Learning to be confident in their abilities is just as important as achieving good results.", "contextvi": "Trường học có thể khuyến khích học sinh thảo luận nguyên nhân căng thẳng và tìm cách lành mạnh để đối phó. Người trẻ có thể nhận lời khuyên từ bạn đồng trang lứa hoặc trò chuyện với người lớn đáng th a bully"], ["The students met to ________ before exam week.", "discuss the causes of stress"], ["Going for a run is one way I ________.", "deal with stress"], ["New students sometimes ________ before choosing a club.", "get advice from their peers"], ["Regular practice helps young musicians ________.", "be confident in their abilities"]]}, {"title": "Nobody Can Do Everything", "genre": "Interview / Dialogue", "p": [{"en": "Lucy helps organise **community service projects** at her school. She explains why successful projects depend on more than good intentions.", "vi": "Lucy giúp tổ chức dự án phục vụ cộng đồng ở trường. Cô giải thích vì sao dự án thành công cần nhiều hơn ý định tốt."}, {"en": "Reporter: What was your first project?\nLucy: Collecting school supplies for **people in need**. It sounded simple; however, organising everything was harder than expected.", "vi": "Phóng viên: Dự án đầu tiên của bạn là gì?\nLucy: Thu gom đồ dùng học tập cho người gặp khó khăn. Nghe đơn giản, tuy nhiên tổ chức mọi việc khó hơn dự kiến."}, {"en": "Reporter: What caused the difficulty?\nLucy: Everyone wanted the same job, and nobody volunteered to organise transport. Therefore, we divided the tasks more carefully.", "vi": "Phóng viên: Điều gì gây khó khăn?\nLucy: Ai cũng muốn làm cùng một việc và không ai tình nguyện tổ chức vận chuyển. Vì vậy chúng tôi phân chia nhiệm vụ cẩn thận hơn."}, {"en": "Reporter: What makes a good team?\nLucy: Good **teamwork**, clear communication and effective **time management**. Strong **leadership** helps, too.", "vi": "Phóng viên: Điều gì tạo nên một nhóm tốt?\nLucy: Làm việc nhóm tốt, giao tiếp rõ ràng và quản lý thời gian hiệu quả. Năng lực lãnh đạo tốt cũng giúp ích."}, {"en": "Reporter: How do you handle disagreements?\nLucy: We give everyone a chance to speak; otherwise, misunderstandings can occur.", "vi": "Phóng viên: Bạn xử lý bất đồng thế nào?\nLucy: Chúng tôi cho mọi người cơ hội nói; nếu không có thể xảy ra hiểu lầm."}, {"en": "Reporter: Would you encourage other teenagers to **participate in a school club**?\nLucy: Certainly. It's a great way to **develop leadership and teamwork skills**.", "vi": "Phóng viên: Bạn có khuyến khích các bạn khác tham gia câu lạc bộ trường không?\nLucy: Chắc chắn rồi. Đó là cách tuyệt vời để phát triển kỹ năng lãnh đạo và làm việc nhóm."}, {"en": "Reporter: What are you most **proud of**?\nLucy: Seeing quieter students become confident enough to share their ideas. You don't need to be the loudest person to make a valuable contribution.", "vi": "Phóng viên: Bạn tự hào nhất về điều gì?\nLucy: Thấy những bạn ít nói trở nên đủ tự tin để chia sẻ ý tưởng. Bạn không cần là người nói to nhất để có đóng góp giá trị."}], "v": [{"en": "community service projects", "vi": "các dự án phục vụ cộng đồng", "kind": "vocab", "context": "Lucy helps organise community service projects at her school. She explains why successful projects depend on more than good intentions.", "contextvi": "Lucy giúp tổ chức dự án phục vụ cộng đồng ở trường. Cô giải thích vì sao dự án thành công cần nhiều hơn ý định tốt.", "example": "Our library supports several community service projects each year.", "examplevi": "Thư viện của chúng tôi hỗ trợ vài dự án phục vụ cộng đồng mỗi năm."}, {"en": "people in need", "vi": "người có hoàn cảnh khó khăn", "kind": "vocab", "context": "Reporter: What was your first project?\nLucy: Collecting school supplies for people in need. It sounded simple; however, organising everything was harder than expected.", "contextvi": "Phóng viên: Dự án đầu tiên của bạn là gì?\nLucy: Thu gom đồ dùng học tập cho người gặp khó khăn. Nghe đơn giản, tuy nhiên tổ chức mọi việc khó hơn dự kiến.", "example": "The food bank provides meals for people in need.", "examplevi": "Ngân hàng thực phẩm cung cấp bữa ăn cho người có hoàn cảnh khó khăn."}, {"en": "teamwork", "vi": "làm việc nhóm", "kind": "vocab", "context": "Reporter: What makes a good team?\nLucy: Good teamwork, clear communication and effective time management. Strong leadership helps, too.", "contextvi": "Phóng viên: Điều gì tạo nên một nhóm tốt?\nLucy: Làm việc nhóm tốt, giao tiếp rõ ràng và quản lý thời gian hiệu quả. Năng lực lãnh đạo tốt cũng giúp ích.", "example": "Good teamwork helped the class finish the display on time.", "examplevi": "Làm việc nhóm tốt giúp lớp hoàn thành bảng trưng bày đúng hạn."}, {"en": "time management", "vi": "quản lý thời gian", "kind": "vocab", "context": "Reporter: What makes a good team?\nLucy: Good teamwork, clear communication and effective time management. Strong leadership helps, too.", "contextvi": "Phóng viên: Điều gì tạo nên một nhóm tốt?\nLucy: Làm việc nhóm tốt, giao tiếp rõ ràng và quản lý thời gian hiệu quả. Năng lực lãnh đạo tốt cũng giúp ích.", "example": "With better time management, I can finish my homework before dinner.", "examplevi": "Nhờ quản lý thời gian tốt hơn, tôi có thể xong bài tập trước bữa tối."}, {"en": "leadership", "vi": "khả năng lãnh đạo", "kind": "vocab", "context": "Reporter: What makes a good team?\nLucy: Good teamwork, clear communication and effective time management. Strong leadership helps, too.", "contextvi": "Phóng viên: Điều gì tạo nên một nhóm tốt?\nLucy: Làm việc nhóm tốt, giao tiếp rõ ràng và quản lý thời gian hiệu quả. Năng lực lãnh đạo tốt cũng giúp ích.", "example": "Leadership means listening as well as making decisions.", "examplevi": "Khả năng lãnh đạo bao gồm cả lắng nghe và ra quyết định."}, {"en": "participate in a school club", "vi": "tham gia câu lạc bộ trường học", "kind": "colloc", "context": "Reporter: Would you encourage other teenagers to participate in a school club?\nLucy: Certainly. It's a great way to develop leadership and teamwork skills.", "contextvi": "Phóng viên: Bạn có khuyến khích các bạn khác tham gia câu lạc bộ trường không?\nLucy: Chắc chắn rồi. Đó là cách tuyệt vời để phát triển kỹ năng lãnh đạo và làm việc nhóm.", "example": "Students who participate in a school club often meet people from other classes.", "examplevi": "Học sinh tham gia câu lạc bộ trường thường gặp bạn ở các lớp khác."}, {"en": "develop leadership and teamwork skills", "vi": "phát triển kỹ năng lãnh đạo và làm việc nhóm", "kind": "colloc", "context": "Reporter: Would you encourage other teenagers to participate in a school club?\nLucy: Certainly. It's a great way to develop leadership and teamwork skills.", "contextvi": "Phóng viên: Bạn có khuyến khích các bạn khác tham gia câu lạc bộ trường không?\nLucy: Chắc chắn rồi. Đó là cách tuyệt vời để phát triển kỹ năng lãnh đạo và làm việc nhóm.", "example": "Organising a charity sale can help you develop leadership and teamwork skills.", "examplevi": "Tổ chức bán hàng từ thiện có thể giúp bạn phát triển kỹ năng lãnh đạo và làm việc nhóm."}, {"en": "proud of", "vi": "tự hào về", "kind": "colloc", "context": "Reporter: What are you most proud of?\nLucy: Seeing quieter students become confident enough to share their ideas. You don't need to be the loudest person to make a valuable contribution.", "contextvi": "Phóng viên: Bạn tự hào nhất về điều gì?\nLucy: Thấy những bạn ít nói trở nên đủ tự tin để chia sẻ ý tưởng. Bạn không cần là người nói to nhất để có đóng góp giá trị.", "example": "You should be proud of what you achieved, even without a prize.", "examplevi": "Bạn nên tự hào về thành quả của mình, dù không có giải thưởng."}], "mc": [["What was Lucy's first project?", "Collecting school supplies", "Organising a concert", "Building a sports hall"], ["How did the team solve its problem?", "By dividing tasks more carefully", "By cancelling the project", "By asking one person to do everything"], ["What does Lucy value?", "Everyone having a chance to contribute", "Only the leader speaking", "Avoiding all discussion"]], "gr": [["It sounded simple; ___, organising it was difficult.", "however", "therefore", "otherwise"], ["Nobody volunteered, ___ we divided the tasks again.", "so", "yet", "or"], ["Everyone needs a chance to speak; ___, misunderstandings can occur.", "otherwise", "however", "therefore"], ["We had a problem; ___, we discussed a solution.", "therefore", "otherwise", "however"], ["Lucy organised the supplies, ___ Tom arranged transport.", "and", "for", "or"]], "wf": [["LEAD", "leadership", "Good ___ helps a team succeed."], ["MANAGE", "management", "Effective time ___ is important."], ["COMMUNICATE", "communication", "Clear ___ prevents misunderstandings."], ["ORGANISE", "organising", "She enjoys ___ community projects."], ["CONTRIBUTE", "contribution", "Everyone can make a valuable ___ ."], ["LEAD", "leader", "The group chose a new ___ ."], ["UNDERSTAND", "misunderstanding", "A simple ___ caused the argument."], ["VALUE", "valuable", "Everyone made a ___ contribution."], ["DECIDE", "decision", "We made a joint ___ about transport."], ["COOPERATE", "cooperation", "The project requires ___ between groups."]], "chunks": [["We give everyone a chance to speak; otherwise, misunderstandings can occur.", "Chúng tôi cho mọi người cơ hội nói; nếu không có thể xảy ra hiểu lầm.", ["We give everyone", "a chance to speak;", "otherwise,", "misunderstandings can occur."]], ["It's a great way to develop leadership and teamwork skills.", "Đó là cách tuyệt vời để phát triển kỹ năng lãnh đạo và làm việc nhóm.", ["It's a great way", "to develop", "leadership and teamwork skills."]], ["Students who participate in a school club often meet people from other classes.", "Học sinh tham gia câu lạc bộ trường thường gặp bạn ở các lớp khác.", ["Students who participate in a school club", "often meet people", "from other classes."]], ["Organising a charity sale can help you develop leadership and teamwork skills.", "Tổ chức bán hàng từ thiện có thể giúp bạn phát triển kỹ năng lãnh đạo và làm việc nhóm.", ["Organising a charity sale", "can help you develop", "leadership and teamwork skills."]], ["You should be proud of what you achieved, even without a prize.", "Bạn nên tự hào về thành quả của mình, dù không có giải t
