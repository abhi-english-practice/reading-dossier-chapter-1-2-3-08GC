vice projects."], "drills": [["Students who ________ often meet people from other classes.", "participate in a school club"], ["Organising a charity sale can help you ________.", "develop leadership and teamwork skills"], ["You should be ________ what you achieved, even without a prize.", "proud of"]]}, {"title": "The Notification Trap", "genre": "Blog / Opinion", "p": [{"en": "I picked up my phone to **check notifications** and somehow spent forty minutes watching short videos. It happens more often than I'd like to admit. I sometimes **log on to my account** without having any particular reason to do so.", "vi": "Tôi cầm điện thoại để kiểm tra thông báo và bằng cách nào đó đã dành bốn mươi phút xem video ngắn. Việc này xảy ra thường xuyên hơn tôi muốn thừa nhận. Đôi khi tôi đăng nhập tài khoản mà không có lý do cụ thể."}, {"en": "Of course, social media has advantages. It helps us **connect with others**, **upload pictures** and exchange ideas on a **teen forum**. Yesterday, I wrote a **post** and tried to **upload a video clip**, but my **Internet connection** was poor, so I had to wait.", "vi": "Tất nhiên mạng xã hội có lợi ích. Nó giúp kết nối với người khác, tải ảnh và trao đổi ý tưởng trên diễn đàn tuổi teen. Hôm qua tôi viết bài đăng và thử tải video, nhưng kết nối Internet kém nên phải đợi."}, {"en": "You can **post a question**, **join a forum** or **join chat and game forums** to meet people with similar interests. Online communities can be useful; however, some teenagers become **addicted to video games** or spend too much time **surfing the net**.", "vi": "Bạn có thể đăng câu hỏi, tham gia diễn đàn hoặc diễn đàn trò chuyện và game để gặp người cùng sở thích. Cộng đồng trực tuyến có thể hữu ích; tuy nhiên một số thanh thiếu niên nghiện trò chơi điện tử hoặc dành quá nhiều thời gian lướt mạng."}, {"en": "I still **spend time on social media**, but I've turned off most notifications. Interestingly, I now have more time for the activities I was always complaining I was too busy to do.", "vi": "Tôi vẫn dành thời gian trên mạng xã hội nhưng đã tắt phần lớn thông báo. Điều thú vị là giờ tôi có thêm thời gian cho những hoạt động mà trước đây luôn than rằng quá bận để làm."}], "v": [{"en": "check notifications", "vi": "kiểm tra thông báo", "kind": "colloc", "context": "I picked up my phone to check notifications and somehow spent forty minutes watching short videos. It happens more often than I'd like to admit. I sometimes log on to my account without having any particular reason to do so.", "contextvi": "Tôi cầm điện thoại để kiểm tra thông báo và bằng cách nào đó đã dành bốn mươi phút xem video ngắn. Việc này xảy ra thường xuyên hơn tôi muốn thừa nhận. Đôi khi tôi đăng nhập tài khoản mà không có lý do cụ thể.", "example": "I try not to check notifications during meals.", "examplevi": "Tôi cố không kiểm tra thông báo trong bữa ăn."}, {"en": "log on to my account", "vi": "đăng nhập tài khoản", "kind": "colloc", "context": "I picked up my phone to check notifications and somehow spent forty minutes watching short videos. It happens more often than I'd like to admit. I sometimes log on to my account without having any particular reason to do so.", "contextvi": "Tôi cầm điện thoại để kiểm tra thông báo và bằng cách nào đó đã dành bốn mươi phút xem video ngắn. Việc này xảy ra thường xuyên hơn tôi muốn thừa nhận. Đôi khi tôi đăng nhập tài khoản mà không có lý do cụ thể.", "example": "I couldn't log on to my account because I'd forgotten the password.", "examplevi": "Tôi không đăng nhập được vào tài khoản vì quên mật khẩu."}, {"en": "connect with others", "vi": "kết nối với người khác", "kind": "colloc", "context": "Of course, social media has advantages. It helps us connect with others, upload pictures and exchange ideas on a teen forum. Yesterday, I wrote a post and tried to upload a video clip, but my Internet connection was poor, so I had to wait.", "contextvi": "Tất nhiên mạng xã hội có lợi ích. Nó giúp kết nối với người kh function updateReadAlong() {
  const button = $('readAlong');
  const player = $('player');
  if (!button || !player) return;
  const times = audioURLs[r().id] ? null : PARAGRAPH_TIMES[r().id];
  let active = -1;
  if (times && button.getAttribute('aria-pressed') === 'true' && player.currentTime > 0 && !player.ended) {
    active = times.findLastIndex(time => player.currentTime >= time);
  }
  $('readingBody').querySelectorAll('[data-paragraph]').forEach(p => {
    p.classList.toggle('following', Number(p.dataset.paragraph) === active);
  });
}

function setupAudio() {
  const player = $('player');
  const id = r().id;
  const play = $('playAudio');
  const stop = $('stopAudio');
  const seek = $('audioSeek');
  const speed = $('audioSpeed');
  const status = $('audioStatus');
  const follow = $('readAlong');
  activeAudio = player;

  const formatTime = seconds => {
    const whole = Number.isFinite(seconds) ? Math.floor(seconds) : 0;
    return Math.floor(whole / 60) + ':' + String(whole % 60).padStart(2, '0');
  };
  function update() {
    if (!player.isConnected) return;
    $('audioTime').textContent = formatTime(player.currentTime) + ' / ' + formatTime(player.duration);
    seek.value = player.currentTime;
    play.textContent = player.paused ? '▶ Play' : '❚❚ Pause';
    updateReadAlong();
  }

  player.onloadedmetadata = () => {
    play.disabled = stop.disabled = seek.disabled = false;
    follow.disabled = !PARAGRAPH_TIMES[id] || !!audioURLs[id];
    follow.title = follow.disabled ? 'Read-along is unavailable for this recording' : 'Highlight the current paragraph';
    seek.max = player.duration;
    status.hidden = true;
    update();
  };
  player.onerror = () => {
    play.disabled = stop.disabled = seek.disabled = follow.disabled = true;
    status.textContent = 'Audio could not load. Choose another audio file.';
    status.hidden = false;
    update();
  };
  player.onplay = () => { stopSpeech(); update(); };
  player.onpause = player.onended = player.ontimeupdate = update;
  play.onclick = () => {
    if (player.paused) player.play().catch(() => toast('Audio could not play.'));
    else player.pause();
  };
  stop.onclick = () => { player.pause(); player.currentTime = 0; update(); };
  seek.oninput = () => { player.currentTime = Number(seek.value); update(); };
  speed.onchange = () => { player.playbackRate = Number(speed.value); };

  play.disabled = stop.disabled = seek.disabled = follow.disabled = true;
  follow.setAttribute('aria-pressed', 'false');
  follow.textContent = '▶ Read-along · OFF';
  status.hidden = false;
  status.textContent = 'Loading audio…';
  player.src = audioURLs[id] || './reading' + num(id) + '.mp3';
  player.playbackRate = Number(speed.value);
}

function selectedPassageRanges() {
  const selection = window.getSelection();

  if (!passage || !selection || !selection.rangeCount || selection.isCollapsed) return [];
  const range = selection.getRangeAt(0);
  if (!passage.contains(range.startContainer) || !passage.contains(range.endContainer)) return [];

  return Array.from(passage.querySelectorAll('[data-paragraph]')).flatMap(paragraph => {
    if (!range.intersectsNode(paragraph)) return [];
    const length = paragraph.textContent.length;
    const offset = (container, index) => {
      const prefix = document.createRange();
      prefix.selectNodeContents(paragraph);
      prefix.setEnd(container, index);
      return prefix.toString().length;
    };
    const start = paragraph.contains(range.startContainer) ? offset(range.startContainer, range.startOffset) : 0;
    const end = paragraph.contains(range.endContainer) ? offset(range.endContainer, range.endOffset) : length;
    return end > start && paragraph.textContent.slice(start, end).trim()
      ? [{ paragraph: Number(paragraph.dataset.paragraph), start, end }] : [];
  });
}

function replaceHighlightRange(marks, selection, color) {
  const { paragraph, start, end } = selection;
  const next = marks.flatMap(mark => {
    if (mark.paragraph !== paragraph || mark.end <= start || mark.start >= end) return [mark];
    const remaining = [];
    if (mark.start < start) remaining.push({ ...mark, end: start });
    if (mark.end > end) remaining.push({ ...mark, start: end });
    return remaining;
  });
  if (highlightColors.has(color)) next.push({ ...selection, color });
  return next.sort((a, b) => a.paragraph - b.paragraph || a.start - b.start);
}

function restoreManualHighlights() {
  const marks = manualHighlights.get(r().id);
  if (!marks?.length) return;
  const passage = $('readingBody');
  for (const paragraph of passage.querySelectorAll('[data-paragraph]')) {
    const ranges = marks.filter(mark => mark.paragraph === Number(paragraph.dataset.paragraph));
    if (!ranges.length) continue;
    const walker = document.createTreeWalker(paragraph, NodeFilter.SHOW_TEXT);
    const nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);

    let offset = 0;
    for (const node of nodes) {
      const text = node.data;
      const end = offset + text.length;
      const overlaps = ranges.filter(mark => mark.start < end && mark.end > offset);
      if (overlaps.length) {
        const fragment = document.createDocumentFragment();
        let cursor = 0;
        for (const mark of overlaps) {
          const from = Math.max(0, mark.start - offset);
          const to = Math.min(text.length, mark.end - offset);
          fragment.append(text.slice(cursor, from));
          const span = document.createElement('mark');
          span.className = 'manual-highlight ' + mark.color;
          span.textContent = text.slice(from, to);
          fragment.append(span);
          cursor = to;
        }
        fragment.append(text.slice(cursor));
        node.replaceWith(fragment);
      }
      offset = end;
    }
  }
}

function refreshPassage() {
  $('readingBody').innerHTML = readBody();
  restoreManualHighlights();
  updateReadAlong();
}

function useHighlightPen(color) {
  let ranges = selectedPassageRanges();
  if (!ranges.length && pendingHighlightSelection?.reading === r().id) {
    ranges = pendingHighlightSelection.ranges;
  }
  pendingHighlightSelection = null;
  if (!ranges.length) {
    toast('Bôi chọn chữ tiếng Anh trong bài trước.');
    return;
  }
  const existing = manualHighlights.get(r().id) || [];
  manualHighlights.set(r().id, ranges.reduce((marks, range) => replaceHighlightRange(marks, range, color), existing));
  window.getSelection()?.removeAllRanges();
  closePop();
  refreshPassage();
}

document.addEventListener('pointerdown', event => {
  const button = event.target.closest('[data-pen]');
  if (!button) {
    pendingHighlightSelection = null;
    return;
  }
  pendingHighlightSelection = { reading: r().id, ranges: selectedPassageRanges() };
  if (event.pointerType === 'mouse' && pendingHighlightSelection.ranges.length) event.preventDefault();
});

function handleClick(e){let b=e.target.closest('button,[role=button]');if(!b){if(!$('pop').contains(e.target))closePop();return}if(b.disabled)return;let d=b.dataset;if(d.pen){useHighlightPen(d.pen);return}if(d.term!==undefined){if(!b.matches('.term')||!selectedPassageRanges().length)openPop(+d.term,b);return}if(d.close){closePop();return}if(d.status&&popState!==null){statuses[vk(r().id,popState)]=d.status;save('abhi03_cards_v1',statuses);closePop();if($('readingBody'))refreshPassage();toast(d.status==='known'?'Marked as known':'Added to study');return}if(d.speak!==undefined){speech(d.speak);return}if(d.go!==undefined){go(+d.go);return}if(d.tab){setTab(d.tab);return}if(d.toggle==='follow'){

;reviewReveal=false}else if(v){statuses[vk(v.rid,v.i)]=d.rev;save('abhi03_cards_v1',statuses);if(reviewFilter==='all')reviewIndex=Math.min(list.length-1,reviewIndex+1);reviewReveal=false}render();return}if(d.writesave){save('abhi03_writing_v1',writing);toast('Draft saved locally');return}if(d.writeclear){delete writing[r().id+':w'];save('abhi03_writing_v1',writing);render();return}if(!$('pop').contains(b))closePop()}
document.addEventListener('click',handleClick);document.addEventListener('input',e=>{let el=e.target;if(el.dataset.input){let [s,i]=el.dataset.input.split(':');answers[key(s,i)]=el.value;delete checked[sk(s)];save('abhi03_answers_v2',answers);save('abhi03_checked_v2',checked);el.classList.remove('good','bad');let quiz=$('quiz-'+s);if(quiz){quiz.querySelectorAll('.result').forEach(n=>n.remove());quiz.querySelectorAll('.good,.bad').forEach(n=>n.classList.remove('good','bad'));quiz.querySelectorAll('.actions .progress').forEach(n=>n.remove());if($('drillTotal'))$('drillTotal').textContent=drillScore();quiz.querySelector('.progress').textContent=qs(s).filter((q,j)=>String(answers[key(s,j)]||'').trim()).length+'/'+qs(s).length+' answered'}}if(el.dataset.writing){writing[el.dataset.writing]=el.value;save('abhi03_writing_v1',writing);if(el.id==='writebox')$('wordCount').textContent=el.value.trim().split(/\s+/).filter(Boolean).length+' words · saved locally'}});document.addEventListener('change',e=>{if(e.target.id==='mobileSelect')go(+e.target.value);if(e.target.id==='reviewScope'){reviewScope=e.target.value;reviewIndex=0;reviewReveal=false;render()}if(e.target.id==='reviewFilter'){reviewFilter=e.target.value;reviewIndex=0;reviewReveal=false;render()}});$('audioFile').addEventListener('change',e=>{let file=e.target.files[0];if(!file)return;let id=r().id;if(audioURLs[id])URL.revokeObjectURL(audioURLs[id]);audioURLs[id]=URL.createObjectURL(file);e.target.value='';setupAudio()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop();if((e.key==='Enter'||e.key===' ')&&e.target.matches('.term')){e.preventDefault();e.target.click();return}if(e.key==='Enter'&&e.target.dataset.input){e.preventDefault();let s=e.target.dataset.input.split(':')[0];checked[sk(s)]=true;save('abhi03_checked_v2',checked);refreshQuiz(s)}});window.addEventListener('resize',closePop);render();
